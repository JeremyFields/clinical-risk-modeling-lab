[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-baselines-portfolio"
version = "0.1.0"
description = "A reproducible study of imbalance handling, Random Forests, and PyTorch tabular networks"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "torch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
